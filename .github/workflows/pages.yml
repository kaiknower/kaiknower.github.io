name: Publish MobiAgent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}mobiagent/
    steps:
      - name: Check out website and original videos
        uses: actions/checkout@v6
        with:
          repository: kaiknower/mobiagent-project-page
          ref: main
          lfs: true
          path: website
          persist-credentials: false
      - name: Prepare MobiAgent website
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('website/dist')
          for asset in (source / 'assets').glob('*.mp4'):
              with asset.open('rb') as stream:
                  assert not stream.read(128).startswith(b'version https://git-lfs'), f'LFS media missing: {asset}'
          shutil.copytree(source, Path('_site/mobiagent'))
          Path('_site/.nojekyll').touch()
          Path('_site/index.html').write_text('<!doctype html><html lang="en"><meta charset="utf-8"><title>MobiAgent</title><meta http-equiv="refresh" content="0;url=./mobiagent/"><a href="./mobiagent/">Open MobiAgent</a></html>')
          Path('_site/RoboEvo2').mkdir()
          Path('_site/RoboEvo2/index.html').write_text('<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RoboEvo&sup2;</title></head><body></body></html>')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
